<article class="w-full" view-transition-name="page">
  <nav class="nndl-page-actions" aria-label="Page actions">
    {% include "templates/copy_button.html" %}
    {% if page.previous_page %}
    <a data-slot="button" id="previous-button"
      class="inline-flex size-8 items-center justify-center rounded-md text-sm transition-colors md:size-7"
      href="{{ page.previous_page.url | url }}" title="{{ _('Previous') }}: {{ page.previous_page.title }}">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"></path><path d="m11 18-6-6 6-6"></path>
      </svg>
      <span class="sr-only">{{ _('Previous') }}</span>
    </a>
    {% endif %}
    {% if page.next_page %}
    <a data-slot="button" id="next-button"
      class="inline-flex size-8 items-center justify-center rounded-md text-sm transition-colors md:size-7"
      href="{{ page.next_page.url | url }}" title="{{ _('Next') }}: {{ page.next_page.title }}">
      <span class="sr-only">{{ _('Next') }}</span>
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path>
      </svg>
    </a>
    {% endif %}
  </nav>

  <div class="typography w-full flex-1 *:data-[slot=alert]:first:mt-0">
    <h1>{% if page.meta.title %}{{ page.meta.title }}{% else %}{{ page.title }}{% endif %}</h1>
    {{ page.content }}
  </div>

  <script>
    document.querySelectorAll('article h2, article h3').forEach((header) => {
      toc.observer.observe(header);
    });
  </script>
</article>
