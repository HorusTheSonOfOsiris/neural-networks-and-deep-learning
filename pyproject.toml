[project]
name = "nueral-network-and-deep-learning"
version = "0.1.0"
description = "A readable, verified edition of Neural Networks and Deep Learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mkdocs>=1.6.1",
    "pymdown-extensions>=10.14",
    "beautifulsoup4>=4.13.0",
    "requests>=2.32.0",
    "lxml>=5.3.0",
    "mkdocs-shadcn==0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
