site_name: Neural Networks and Deep Learning
site_description: Unofficial readable mirror of Michael Nielsen's book (CC BY-NC 3.0)
site_url: https://example.github.io/nndl-book/

theme:
  name: shadcn
  custom_dir: overrides
  show_title: true
  show_stargazers: false
  show_datetime: false
  topbar_sections: false
  accent: "#b45f32"
  katex_options: {}
  pygments_style:
    light: github-light
    dark: github-dark

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - css/paper.css

extra_javascript:
  - js/mathjax-config.js
  - js/mathjax/tex-chtml.js
  - js/interactives/chap1-plots.js

nav:
  - Home: index.md
  - Chapters:
      - Chapter 1 - Using neural nets to recognize handwritten digits: chap1.md
      - Chapter 2 - How the backpropagation algorithm works: chap2.md
      - Chapter 3 - Improving the way neural networks learn: chap3.md
      - Chapter 4 - A visual proof that neural nets can compute any function: chap4.md
      - Chapter 5 - Why are deep neural networks hard to train?: chap5.md
      - Chapter 6 - Deep learning: chap6.md
  - Resources:
      - Appendix - Is there a simple algorithm for intelligence?: appendix-sai.md
      - Exercises & Problems: exercises-and-problems.md
  - About:
      - Acknowledgements: acknowledgements.md
      - FAQ: faq.md
